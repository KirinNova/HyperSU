name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Keystore
        run: |
          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS=$(openssl rand -hex 16)
          
          keytool -genkeypair -v \
            -keystore my-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias my-alias \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=SukiSU User"
          
          BASE64=$(base64 -w 0 my-release-key.jks)
          
          echo "=================================================="
          echo "请把下面这 4 行分别复制到 GitHub Secrets 里："
          echo "=================================================="
          echo "KEYSTORE=$BASE64"
          echo "KEYSTORE_PASSWORD=$STORE_PASS"
          echo "KEY_ALIAS=my-alias"
          echo "KEY_PASSWORD=$KEY_PASS"
          echo "=================================================="
